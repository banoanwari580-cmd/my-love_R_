name: Build My Love Razma Android APK (Debug & Release)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses & Install SDK Components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "platform-tools" || true

      - name: Verify Tools & Environment
        run: |
          node --version
          npm --version
          java -version

      - name: Install NPM Dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Web Application
        run: npm run build

      - name: Verify Web Bundle
        run: |
          if [ ! -d "dist" ] || [ ! -f "dist/index.html" ]; then
            echo "ERROR: Web production build failed or dist/index.html is missing"
            exit 1
          fi
          echo "Web application build verified successfully"

      - name: Synchronize Capacitor Android
        run: |
          npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: |
          chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Verify Debug APK File Existence
        run: |
          if [ ! -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: android/app/build/outputs/apk/debug/app-debug.apk does not exist!"
            exit 1
          fi
          echo "SUCCESS: Debug APK verified successfully!"
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Love-Razma-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Android Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Love-Razma-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Build Summary
        run: |
          echo "### 🎉 Android APK Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "- **Package ID:** \`com.mylove.razma\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Name:** \`My-Love-Razma-APK\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Primary APK File:** \`app-debug.apk\` (Debug Signed - Ready for direct Android installation)" >> $GITHUB_STEP_SUMMARY
          echo "- **Java Version:** JDK 21 (Zulu)" >> $GITHUB_STEP_SUMMARY
          echo "- **Node Version:** Node 22" >> $GITHUB_STEP_SUMMARY

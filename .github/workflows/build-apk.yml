
name: Build My Love Razma Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Licenses and Install Required SDK Packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Environment
        run: |
          node --version
          npm --version
          java -version
          sdkmanager --version

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Web Application
        run: npm run build

      - name: Verify Web Bundle
        run: |
          if [ ! -d "dist" ] || [ ! -f "dist/index.html" ]; then
            echo "ERROR: Web production build failed or dist/index.html is missing"
            exit 1
          fi
          echo "Web application build verified successfully"

      - name: Synchronize Capacitor Android
        run: npx cap sync android

      - name: Verify Android Project and Gradlew
        run: |
          if [ ! -d "android" ]; then
            echo "ERROR: android directory does not exist"
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew does not exist"
            exit 1
          fi

          chmod +x android/gradlew
          echo "Android project and gradlew verified successfully"

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify Debug APK File Existence
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"

          if test -s "$APK_PATH"; then
            echo "SUCCESS: Debug APK generated and verified!"
            ls -lh "$APK_PATH"
          else
            echo "ERROR: APK was not generated or is empty!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Love-Razma-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Summary
        if: success()
        run: |
          echo "### Android APK Build Succeeded!" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package ID: com.mylove.razma" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: My-Love-Razma-APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: app-debug.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "- Android SDK: API 35" >> "$GITHUB_STEP_SUMMARY"
          echo "- Java: JDK 21" >> "$GITHUB_STEP_SUMMARY"
          echo "- Node: 22" >> "$GITHUB_STEP_SUMMARY"
